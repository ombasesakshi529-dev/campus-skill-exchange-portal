<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Post a Skill - Campus Skill Exchange</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
  <div id="site-header"></div>
  <main class="max-w-3xl mx-auto p-6">
    <div class="card">
      <h2 class="text-xl font-semibold">Post a Skill</h2>
      <form id="post-skill-form" class="space-y-4 mt-4">
        <input id="title" placeholder="Skill title" class="w-full p-2 border rounded" required />
        <input id="short" placeholder="Short summary" class="w-full p-2 border rounded" />
        <textarea id="description" placeholder="Full description and details" class="w-full p-2 border rounded" rows="6"></textarea>
        <input id="price" placeholder="Suggested price or free" class="w-full p-2 border rounded" />
        <button class="bg-indigo-600 text-white px-4 py-2 rounded">Post</button>
      </form>
      <div id="status" class="mt-3 text-sm"></div>
    </div>
  </main>
  <div id="site-footer"></div>

  <script src="/static/js/firebaseConfig.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <script src="/static/js/layout.js"></script>
  <script src="/static/js/auth.js"></script>

  <script>
    onAuthStateChanged(async (ctx) => {
      if (!ctx) { window.location.href = '/login.html'; return; }
      document.getElementById('post-skill-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const title = document.getElementById('title').value;
        const short = document.getElementById('short').value;
        const description = document.getElementById('description').value;
        const price = document.getElementById('price').value;
        const newRef = firebase.database().ref('skills').push();
        await newRef.set({
          title, short, description, price,
          owner: ctx.user.uid,
          ownerName: ctx.user.displayName || ctx.user.email,
          createdAt: Date.now()
        });
        document.getElementById('status').textContent = 'Posted successfully!';
        setTimeout(()=>window.location.href='/skill_detail.html?id='+newRef.key,500);
        const firebaseConfig = {
  apiKey: "AIzaSyB6z6HRLZm8UWQuQPDlEDIK2O5LDUYG0l4",
  authDomain: "backend-python-database.firebaseapp.com",
  databaseURL: "https://backend-python-database-default-rtdb.firebaseio.com",
  projectId: "backend-python-database",
  storageBucket: "backend-python-database.firebasestorage.app",
  messagingSenderId: "366124632220",
  appId: "1:366124632220:web:0245bc53207ff591fd8559",
  measurementId: "G-Y92Y8LF7QK"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
      });
    });
  </script>
</body>
</html>
