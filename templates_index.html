<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Campus Skill Exchange</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="bg-gray-50 text-gray-800">
  <div id="site-header"></div>

  <main class="max-w-6xl mx-auto p-6">
    <section class="grid md:grid-cols-2 gap-6 items-center">
      <div>
        <h1 class="text-4xl font-bold mb-4">Share. Learn. Grow.</h1>
        <p class="mb-4">Campus Skill Exchange helps students post skills they can teach and find peers to learn from.</p>
        <div class="space-x-3">
          <a href="/browse_skills.html" class="bg-indigo-600 text-white px-4 py-2 rounded">Browse Skills</a>
          <a href="/post_skill.html" class="border border-indigo-600 px-4 py-2 rounded text-indigo-600">Post a Skill</a>
        </div>
      </div>
      <div>
        <img src="https://images.unsplash.com/photo-1529070538774-1843cb3265df?q=80&w=1200&auto=format&fit=crop&ixlib=rb-4.0.3&s=6d0e44b4d7f4b1b1f5b9b8f2c9c9bd7a" alt="students" class="rounded shadow">
      </div>
    </section>

    <section class="mt-8">
      <h2 class="text-2xl font-semibold mb-4">Featured skills</h2>
      <div id="featured" class="grid md:grid-cols-3 gap-4"></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <!-- Firebase SDKs -->
  <script src="/static/js/firebaseConfig.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <script src="/static/js/layout.js"></script>
  <script src="/static/js/auth.js"></script>

  <script>
    // small page logic: load featured skills
    const dbRef = firebase.database().ref('skills').limitToLast(6);
    dbRef.on('value', snap => {
      const container = document.getElementById('featured');
      container.innerHTML = '';
      if (!snap.exists()) {
        container.innerHTML = '<div class="text-gray-500">No skills yet</div>';
        return;
      }
      const skills = Object.entries(snap.val()).reverse();
      skills.forEach(([id, s]) => {
        const el = document.createElement('div');
        el.className = 'card';
        el.innerHTML = `<h3 class="font-semibold">${s.title}</h3>
          <p class="text-sm text-gray-600">${s.short || ''}</p>
          <div class="mt-2 flex justify-between items-center">
            <a href="/skill_detail.html?id=${id}" class="text-indigo-600 underline">View</a>
            <span class="text-xs text-gray-500">${new Date(s.createdAt).toLocaleDateString()}</span>
          </div>`;
        container.appendChild(el);
        const firebaseConfig = {
  apiKey: "AIzaSyB6z6HRLZm8UWQuQPDlEDIK2O5LDUYG0l4",
  authDomain: "backend-python-database.firebaseapp.com",
  databaseURL: "https://backend-python-database-default-rtdb.firebaseio.com",
  projectId: "backend-python-database",
  storageBucket: "backend-python-database.firebasestorage.app",
  messagingSenderId: "366124632220",
  appId: "1:366124632220:web:0245bc53207ff591fd8559",
  measurementId: "G-Y92Y8LF7QK"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
      });
    });
  </script>
</body>
</html>
