<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Manage Users - Campus Skill Exchange</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
  <div id="site-header"></div>
  <main class="max-w-6xl mx-auto p-6">
    <h1 class="text-2xl font-bold">Manage Users</h1>
    <div id="users" class="mt-4"></div>
  </main>
  <div id="site-footer"></div>

  <script src="/static/js/firebaseConfig.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <script src="/static/js/layout.js"></script>
  <script src="/static/js/auth.js"></script>

  <script>
    onAuthStateChanged(async (ctx) => {
      if (!ctx) { window.location.href = '/login.html'; return; }
      if (!ctx.isAdminClaim) { document.getElementById('users').textContent = 'Access denied'; return; }
      firebase.database().ref('users').on('value', snap => {
        const el = document.getElementById('users');
        el.innerHTML = '';
        if (!snap.exists()) { el.textContent = 'No users'; return; }
        Object.entries(snap.val()).forEach(([uid,u])=>{
          const div = document.createElement('div');
          div.className = 'card mb-2';
          div.innerHTML = `<div class="flex justify-between"><div><strong>${u.name || u.email}</strong><div class="text-xs text-gray-600">${u.email}</div></div><div><small>Role: ${u.role || 'user'}</small></div></div>`;
          el.appendChild(div);
          const firebaseConfig = {
  apiKey: "AIzaSyB6z6HRLZm8UWQuQPDlEDIK2O5LDUYG0l4",
  authDomain: "backend-python-database.firebaseapp.com",
  databaseURL: "https://backend-python-database-default-rtdb.firebaseio.com",
  projectId: "backend-python-database",
  storageBucket: "backend-python-database.firebasestorage.app",
  messagingSenderId: "366124632220",
  appId: "1:366124632220:web:0245bc53207ff591fd8559",
  measurementId: "G-Y92Y8LF7QK"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
        });
      });
    });
  </script>
</body>
</html>
