<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Profile - Campus Skill Exchange</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
  <div id="site-header"></div>
  <main class="max-w-3xl mx-auto p-6">
    <div class="card">
      <h2 class="text-xl font-semibold">My Profile</h2>
      <div id="profile-area" class="mt-4"></div>
      <a href="/edit_profile.html" class="mt-4 inline-block text-indigo-600">Edit profile</a>
    </div>
  </main>
  <div id="site-footer"></div>

  <script src="/static/js/firebaseConfig.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <script src="/static/js/layout.js"></script>
  <script src="/static/js/auth.js"></script>

  <script>
    onAuthStateChanged(async (ctx) => {
      if (!ctx) { window.location.href = '/login.html'; return; }
      const uid = ctx.user.uid;
      const snap = await firebase.database().ref('users/'+uid).once('value');
      const u = snap.val() || {};
      document.getElementById('profile-area').innerHTML = `
        <div><strong>${u.name || ctx.user.email}</strong></div>
        <div class="text-sm text-gray-600">${u.email || ctx.user.email}</div>
        <div class="mt-2">Role: <strong>${u.role || 'user'}</strong></div>
        <div class="mt-3 text-sm text-gray-500">Member since: ${u.createdAt ? new Date(u.createdAt).toLocaleDateString() : '—'}</div>;
        const firebaseConfig = {
  apiKey: "AIzaSyB6z6HRLZm8UWQuQPDlEDIK2O5LDUYG0l4",
  authDomain: "backend-python-database.firebaseapp.com",
  databaseURL: "https://backend-python-database-default-rtdb.firebaseio.com",
  projectId: "backend-python-database",
  storageBucket: "backend-python-database.firebasestorage.app",
  messagingSenderId: "366124632220",
  appId: "1:366124632220:web:0245bc53207ff591fd8559",
  measurementId: "G-Y92Y8LF7QK"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
      
    });
  </script>

</body>
</html>
